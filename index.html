<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>체크리스트 제출함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Supabase JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --accent:#4E7CB2;
    --ink:#F4F3F1;
    --ink-dim:rgba(244,243,241,0.62);
    --ink-faint:rgba(244,243,241,0.32);
    --glass-bg:rgba(255,255,255,0.055);
    --glass-bg-strong:rgba(255,255,255,0.09);
    --glass-border:rgba(255,255,255,0.14);
    --good:#6FA97E;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', system-ui, sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{ box-sizing:inherit; }
  html,body{ margin:0; padding:0; min-height:100%; font-family:var(--font-body); background:#0A0A0B; color:var(--ink); position:relative; overflow-x:hidden; }
  input,select,button{ font-family:inherit; }
  ::selection{ background:color-mix(in srgb, var(--accent) 45%, transparent); }

  .stage-bg{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .stage-bg .blob{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.32; background:radial-gradient(circle at 30% 30%, var(--accent), transparent 70%); transition:background 1s ease; }
  .blob-1{ width:520px; height:520px; top:-160px; left:-120px; }
  .blob-2{ width:420px; height:420px; bottom:-140px; right:-100px; opacity:.22; background:radial-gradient(circle at 30% 30%, #ffffff, transparent 70%); }
  @media (prefers-reduced-motion: no-preference){
    .blob-1{ animation:drift1 26s ease-in-out infinite alternate; }
    .blob-2{ animation:drift2 32s ease-in-out infinite alternate; }
  }
  @keyframes drift1{ 0%{ transform:translate(0,0) scale(1); } 100%{ transform:translate(40px,30px) scale(1.08); } }
  @keyframes drift2{ 0%{ transform:translate(0,0) scale(1); } 100%{ transform:translate(-30px,-24px) scale(1.05); } }
  .noise{ position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.035; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  .save-indicator{ position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); left:50%; transform:translate(-50%,-6px); z-index:80;
    padding:8px 16px; border-radius:999px; background:var(--glass-bg-strong); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--glass-border); font-size:12.5px; font-weight:500; color:var(--ink-dim);
    opacity:0; transition:opacity .3s ease, transform .3s ease; pointer-events:none; }
  .save-indicator.show{ opacity:1; transform:translate(-50%,0); }

  .top-bar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:50; display:flex; justify-content:space-between; align-items:center; padding:16px 18px; }
  .brand{ display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-size:15px; font-weight:500; color:var(--ink-dim); }
  .brand .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .icon-btn{ appearance:none; border:1px solid var(--glass-border); cursor:pointer; width:38px; height:38px; border-radius:50%;
    background:var(--glass-bg); backdrop-filter:blur(14px); color:var(--ink-dim); display:flex; align-items:center; justify-content:center; transition:background .2s; }
  .icon-btn:hover{ background:var(--glass-bg-strong); color:var(--ink); }
  .icon-btn svg{ width:16px; height:16px; }

  .stage{ position:relative; z-index:2; min-height:calc(100vh - 70px); padding:10px 20px 90px; display:flex; flex-direction:column; align-items:center; }
  .screen{ display:none; width:100%; max-width:620px; }
  .screen.active{ display:flex; flex-direction:column; align-items:center; animation:viewIn .4s ease-out; }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

  .head{ text-align:center; margin-bottom:22px; width:100%; }
  .head h1{ font-family:var(--font-display); font-weight:500; font-size:clamp(26px,5vw,38px); margin:0 0 8px; }
  .head p{ margin:0; color:var(--ink-dim); font-size:14.5px; }

  .glass-card{ width:100%; background:var(--glass-bg); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    border:1px solid var(--glass-border); border-radius:24px; box-shadow:0 20px 50px -18px rgba(0,0,0,0.55); padding:20px; }
  .glass-card + .glass-card{ margin-top:14px; }

  .gate-card{ max-width:400px; text-align:center; }
  .gate-card h2{ font-family:var(--font-display); font-size:20px; margin:0 0 6px; }
  .gate-card p{ color:var(--ink-dim); font-size:13.5px; margin:0 0 18px; line-height:1.5; }
  .gate-input{ width:100%; background:rgba(255,255,255,0.06); border:1px solid var(--glass-border); border-radius:14px; padding:13px 15px;
    color:var(--ink); font-size:14.5px; outline:none; margin-bottom:12px; }
  .gate-input:focus{ border-color:var(--accent); }
  .primary-btn{ appearance:none; border:none; cursor:pointer; width:100%; padding:13px; border-radius:14px; background:var(--accent); color:#fff; font-weight:700; font-size:14px; transition:filter .2s; }
  .primary-btn:hover{ filter:brightness(1.1); }

  .progress-wrap{ display:flex; flex-direction:column; align-items:center; gap:8px; margin:2px 0 24px; }
  .ring{ position:relative; width:100px; height:100px; }
  .ring svg{ width:100%; height:100%; display:block; }
  .ring .ring-track{ stroke:rgba(255,255,255,0.12); }
  .ring .ring-progress{ stroke:var(--accent); stroke-dasharray:314.159265; transition:stroke-dashoffset .4s ease; }
  .ring-text{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .ring-text .num{ font-weight:700; font-size:21px; }

  .row{ display:flex; align-items:center; gap:14px; padding:14px 4px; border-bottom:1px solid rgba(255,255,255,0.08); }
  .row:last-child{ border-bottom:none; }
  .row-label{ flex:1 1 auto; font-weight:500; font-size:15px; word-break:break-word; }
  .row[data-checked="true"] .row-label{ color:var(--ink-faint); text-decoration:line-through; }
  .row-input{ flex:1 1 auto; font-weight:500; font-size:15px; color:var(--ink); background:transparent; border:none; outline:none; border-bottom:1px dashed rgba(255,255,255,0.22); padding:2px 0; }
  .row-del{ background:transparent; border:none; color:var(--ink-dim); cursor:pointer; font-size:16px; opacity:.45; width:24px; height:24px; }
  .row-del:hover{ opacity:1; color:#e07b74; }

  .toggle-sw{ flex:0 0 auto; width:46px; height:26px; border-radius:999px; border:1px solid rgba(255,255,255,0.16); cursor:pointer; position:relative; background:rgba(255,255,255,0.08); transition:all .28s; }
  .toggle-sw .thumb{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--ink-dim); transition:transform .28s; }
  .toggle-sw[aria-pressed="true"]{ background:color-mix(in srgb, var(--accent) 60%, transparent); border-color:var(--accent); }
  .toggle-sw[aria-pressed="true"] .thumb{ transform:translateX(20px); background:#fff; }

  .checkbox-sq{ flex:0 0 auto; width:22px; height:22px; border-radius:6px; border:1.4px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.04); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .checkbox-sq svg{ width:13px; height:13px; stroke:#fff; stroke-width:2.6; fill:none; display:none; }
  .checkbox-sq[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); }
  .checkbox-sq[aria-pressed="true"] svg{ display:block; }

  .tabs{ display:flex; gap:8px; margin-bottom:16px; width:100%; }
  .tab-btn{ flex:1; padding:11px; border-radius:14px; background:var(--glass-bg); color:var(--ink-dim); border:1px solid var(--glass-border); cursor:pointer; font-weight:700; }
  .tab-btn.active{ background:var(--glass-bg-strong); color:var(--ink); border-color:var(--accent); }
  .tab-panel{ display:none; width:100%; }
  .tab-panel.active{ display:block; }

  .switch-line{ display:flex; align-items:center; gap:9px; margin-bottom:16px; color:var(--ink-dim); font-size:13px; font-weight:600; }
  .switch-line .grow{ flex:1; }
  .switcher{ display:inline-flex; gap:2px; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:999px; padding:4px; }
  .switcher button{ border:none; cursor:pointer; padding:6px 12px; border-radius:999px; font-size:12px; background:transparent; color:var(--ink-dim); }
  .switcher button.active{ background:var(--glass-bg-strong); color:var(--ink); }

  .swatches{ display:flex; gap:9px; margin-bottom:18px; flex-wrap:wrap; }
  .swatches button{ width:22px; height:22px; border-radius:50%; border:none; cursor:pointer; }
  .swatches button.active{ outline:2px solid #fff; outline-offset:2px; }

  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .stat-box{ background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:16px; padding:14px 10px; text-align:center; }
  .stat-box .n{ font-family:var(--font-display); font-size:22px; font-weight:600; }
  .stat-box .l{ font-size:11px; color:var(--ink-dim); margin-top:2px; }
  .dash-toolbar{ display:flex; gap:8px; margin-bottom:12px; }
  .dash-toolbar input, .dash-toolbar select{ background:rgba(255,255,255,0.06); border:1px solid var(--glass-border); border-radius:10px; color:var(--ink); font-size:13px; padding:9px 11px; outline:none; }
  .dash-toolbar input{ flex:1; }

  .sub-row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.08); }
  .sub-name{ font-weight:600; font-size:14px; }
  .sub-time{ font-size:11px; color:var(--ink-faint); margin-top:2px; }
  .sub-bar-wrap{ flex:1; background:rgba(255,255,255,0.1); height:7px; border-radius:999px; overflow:hidden; }
  .sub-bar-fill{ height:100%; background:var(--accent); }
  .sub-pct{ font-weight:700; font-size:13px; width:38px; text-align:right; }

  .modal-overlay{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.65); opacity:0; pointer-events:none; transition:opacity .2s; }
  .modal-overlay.show{ opacity:1; pointer-events:auto; }
  .modal-card{ width:90%; max-width:360px; background:#18181B; border:1px solid var(--glass-border); border-radius:20px; padding:22px; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .modal-btn{ padding:8px 14px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
  .modal-btn-ghost{ background:rgba(255,255,255,0.1); color:#fff; }
  .modal-btn-primary{ background:var(--accent); color:#fff; }
  .link-line{ margin-top:16px; text-align:center; }
  .link-line button{ background:transparent; border:none; color:var(--ink-faint); cursor:pointer; text-decoration:underline; font-size:13px; }
</style>
</head>
<body>

  <div class="stage-bg"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
  <div class="noise"></div>
  <div class="save-indicator" id="save-indicator">저장됨</div>

  <div class="top-bar">
    <div class="brand"><span class="dot"></span><span id="brand-label">체크리스트 제출함</span></div>
    <button type="button" class="icon-btn" id="lock-btn" aria-label="관리자">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </button>
  </div>

  <div class="stage">
    <!-- 1. 게이트 화면 -->
    <section class="screen active" id="screen-gate">
      <div class="head"><h1 id="gate-title">체크리스트 제출함</h1><p id="gate-subtitle"></p></div>
      <div class="glass-card gate-card">
        <h2>제출자 정보</h2>
        <p>이름 또는 구분값을 입력하면 관리자가 확인할 수 있어요.</p>
        <input class="gate-input" id="gate-name-input" placeholder="이름 (예: 홍길동, 1팀 김OO)">
        <button type="button" class="primary-btn" id="gate-start-btn">시작하기</button>
      </div>
    </section>

    <!-- 2. 제출자 작성 화면 -->
    <section class="screen" id="screen-submit">
      <div class="head"><h1 id="submit-title">체크리스트</h1><p id="submit-subtitle"></p></div>
      <div class="progress-wrap">
        <div class="ring">
          <svg viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="50" stroke-width="10" fill="none"/>
            <circle class="ring-progress" id="submit-ring" cx="60" cy="60" r="50" stroke-width="10" fill="none" stroke-linecap="round" transform="rotate(-90 60 60)"/>
          </svg>
          <div class="ring-text"><span class="num" id="submit-ring-num">0%</span></div>
        </div>
        <div style="font-size:12.5px; color:var(--ink-dim);" id="submit-caption">0 / 0 완료</div>
      </div>
      <div class="glass-card"><div id="submit-list"></div></div>
      <div class="link-line"><button type="button" id="switch-person-btn">제출자 변경 (새 이름으로 시작)</button></div>
    </section>

    <!-- 3. 관리자 화면 -->
    <section class="screen" id="screen-admin">
      <div class="head"><h1>관리자 모드</h1></div>
      <div class="tabs">
        <button type="button" class="tab-btn active" id="tab-btn-form">양식 관리</button>
        <button type="button" class="tab-btn" id="tab-btn-dash">제출 현황</button>
      </div>

      <!-- 탭 1: 양식 관리 -->
      <div class="tab-panel active" id="tab-form">
        <div class="glass-card">
          <div style="font-size:12px; margin-bottom:6px; color:var(--ink-faint);">제목 / 부제목</div>
          <input class="gate-input" id="admin-title" placeholder="제목">
          <input class="gate-input" id="admin-subtitle" placeholder="부제목">

          <div style="font-size:12px; margin-bottom:6px; color:var(--ink-faint);">포인트 컬러</div>
          <div class="swatches" id="admin-swatches"></div>

          <div class="switch-line">
            <span>표시 스타일</span><div class="grow"></div>
            <div class="switcher" id="style-switcher">
              <button type="button" data-style="toggle" class="active">토글형</button>
              <button type="button" data-style="checkbox">체크박스형</button>
            </div>
          </div>

          <div class="switch-line">
            <span>복수 선택 허용</span><div class="grow"></div>
            <div class="switcher" id="multi-switcher">
              <button type="button" data-val="true" class="active">허용</button>
              <button type="button" data-val="false">단일선택</button>
            </div>
          </div>

          <div style="font-size:12px; margin-bottom:6px; color:var(--ink-faint);">체크 항목 목록</div>
          <div id="admin-item-list"></div>
          <button type="button" class="modal-btn modal-btn-ghost" id="admin-add-btn" style="width:100%; margin-top:10px;">+ 항목 추가</button>
        </div>

        <div class="glass-card">
          <div style="font-size:12px; margin-bottom:6px; color:var(--ink-faint);">관리자 비밀번호 변경</div>
          <input class="gate-input" id="admin-pw-change" placeholder="새 비밀번호 (비워두면 기존 유지)">
        </div>

        <button type="button" class="primary-btn" id="admin-save-btn" style="margin-top:14px;">저장 및 배포</button>
      </div>

      <!-- 탭 2: 대시보드 -->
      <div class="tab-panel" id="tab-dash">
        <div class="stat-grid">
          <div class="stat-box"><div class="n" id="stat-count">0</div><div class="l">제출 인원</div></div>
          <div class="stat-box"><div class="n" id="stat-avg">0%</div><div class="l">평균 진행률</div></div>
          <div class="stat-box"><div class="n" id="stat-complete">0</div><div class="l">완료 인원</div></div>
        </div>
        <div class="dash-toolbar">
          <input id="dash-search" placeholder="이름으로 검색">
          <select id="dash-sort">
            <option value="recent">최근 업데이트순</option>
            <option value="pct-desc">진행률 높은순</option>
            <option value="pct-asc">진행률 낮은순</option>
            <option value="name">이름순</option>
          </select>
        </div>
        <div class="glass-card"><div id="dash-list"></div></div>
      </div>

      <div class="link-line"><button type="button" id="admin-logout-btn">관리자 모드 종료</button></div>
    </section>
  </div>

  <!-- 관리자 로그인 모달 -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-card">
      <h3 style="margin-top:0;">관리자 모드</h3>
      <input class="gate-input" id="login-pw-input" type="password" placeholder="비밀번호">
      <div class="modal-actions">
        <button type="button" class="modal-btn modal-btn-ghost" onclick="closeModal('login-modal')">취소</button>
        <button type="button" class="modal-btn modal-btn-primary" id="login-confirm-btn">확인</button>
      </div>
    </div>
  </div>

<script>
// ================= [Supabase 연결 정보] =================
const SUPABASE_URL = 'https://zwuklkzgndfxvhghxmqj.supabase.co';
// 주신 anon 키를 바로 적용했습니다.
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3dWtsa3pnbmRmeHZoZ2h4bXFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNDkwODIsImV4cCI6MjEwNTYyNTA4Mn0.p1mznrNeU6_BaFcnbxnNbrCk9yP4rUzeRHHuSuQhz8M';

// 이전 잘못 저장된 키 캐시 제거
localStorage.removeItem('sb_app_key');

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PALETTE = ['#203F9A','#4E7CB2','#94C2DA','#E84797','#F1642E','#A3B565','#504E76','#C4C3E3'];
let config = { 
  title: '체크리스트 제출함', subtitle: '', accent: '#4E7CB2', style: 'toggle', multi: true, 
  items: [{id:'it_1', text:'첫 번째 할 일'}, {id:'it_2', text:'두 번째 할 일'}], 
  password: 'admin1234' 
};
let subId = localStorage.getItem('subId') || null;
let subName = localStorage.getItem('subName') || null;
let mySub = null;
let isAdmin = false;
let allSubs = [];

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showNotice(msg){
  const el = document.getElementById('save-indicator');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), 1500);
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

// 1. 설정 불러오기
async function loadConfig(){
  try {
    const { data, error } = await db.from('checklist_config').select('*').eq('id', 1).maybeSingle();
    if(data) {
      config = { ...config, ...data };
      if(!Array.isArray(config.items) || config.items.length === 0){
        config.items = [{id:'it_1', text:'첫 번째 할 일'}, {id:'it_2', text:'두 번째 할 일'}];
      }
    }
  } catch(err) {
    console.error('설정 로드 실패:', err);
  }
  document.documentElement.style.setProperty('--accent', config.accent || '#4E7CB2');
  document.getElementById('brand-label').textContent = config.title;
  document.getElementById('gate-title').textContent = config.title;
  document.getElementById('gate-subtitle').textContent = config.subtitle || '';
  document.getElementById('submit-title').textContent = config.title;
  document.getElementById('submit-subtitle').textContent = config.subtitle || '';
}

// 2. 제출자 등록 및 시작
async function startSubmitting(){
  const name = document.getElementById('gate-name-input').value.trim();
  if(!name){
    alert('이름을 입력해주세요!');
    return;
  }

  try {
    const { data, error } = await db.from('submissions').insert([{ name, checks: {} }]).select().single();
    if(error){
      alert('DB 오류: ' + error.message + '\n(Supabase SQL Editor에서 RLS 해제 쿼리를 실행했는지 확인해주세요)');
      return;
    }
    if(data){
      subId = data.id; 
      subName = name;
      localStorage.setItem('subId', subId);
      localStorage.setItem('subName', subName);
      enterSubmitter();
    }
  } catch(err) {
    alert('연결 에러: ' + err.message);
  }
}

// 3. 제출자 화면 진입
async function enterSubmitter(){
  showScreen('screen-submit');
  if(!subId) return;
  try {
    const { data } = await db.from('submissions').select('*').eq('id', subId).maybeSingle();
    mySub = data || { checks: {} };
  } catch(e) {
    mySub = { checks: {} };
  }
  renderSubmit();
}

// 4. 체크리스트 렌더링
function renderSubmit(){
  const checks = mySub?.checks || {};
  const items = config.items || [];
  const checked = items.filter(it => checks[it.id]).length;
  const pct = items.length ? Math.round(checked / items.length * 100) : 0;
  
  const circ = 2 * Math.PI * 50;
  document.getElementById('submit-ring').style.strokeDashoffset = circ - (circ * pct / 100);
  document.getElementById('submit-ring-num').textContent = pct + '%';
  document.getElementById('submit-caption').textContent = `${checked} / ${items.length} 완료`;

  const list = document.getElementById('submit-list');
  const isCheckbox = config.style === 'checkbox';

  list.innerHTML = items.map(it => {
    const on = !!checks[it.id];
    const ctrl = isCheckbox
      ? `<button type="button" class="checkbox-sq" aria-pressed="${on}" onclick="toggleItem('${it.id}')"><svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg></button>`
      : `<button type="button" class="toggle-sw" aria-pressed="${on}" onclick="toggleItem('${it.id}')"><span class="thumb"></span></button>`;
    return `
      <div class="row" data-checked="${on}">
        ${ctrl}
        <div class="row-label">${esc(it.text)}</div>
      </div>
    `;
  }).join('') || '<div style="text-align:center; padding:20px; color:var(--ink-faint);">등록된 항목이 없습니다.</div>';
}

// 5. 체크 토글
async function toggleItem(id){
  const checks = { ...(mySub?.checks || {}) };
  const willOn = !checks[id];
  
  if(!config.multi && willOn) {
    Object.keys(checks).forEach(k => checks[k] = false);
  }
  checks[id] = willOn;
  mySub.checks = checks;
  renderSubmit();

  try {
    const { error } = await db.from('submissions').update({ checks, updated_at: new Date().toISOString() }).eq('id', subId);
    if(!error) showNotice('저장됨');
  } catch(e){}
}

// 6. 관리자 모드
document.getElementById('lock-btn').onclick = () => {
  if(isAdmin) showAdmin();
  else openModal('login-modal');
};

document.getElementById('login-confirm-btn').onclick = () => {
  const pw = document.getElementById('login-pw-input').value;
  if(pw === (config.password || 'admin1234')){
    isAdmin = true;
    closeModal('login-modal');
    showAdmin();
  } else {
    alert('비밀번호가 올바르지 않습니다.');
  }
};
document.getElementById('login-pw-input').onkeydown = (e) => { if(e.key === 'Enter') document.getElementById('login-confirm-btn').click(); };

function showAdmin(){
  showScreen('screen-admin');
  document.getElementById('admin-title').value = config.title;
  document.getElementById('admin-subtitle').value = config.subtitle || '';
  
  const sw = document.getElementById('admin-swatches');
  sw.innerHTML = PALETTE.map(c => `<button style="background:${c}" class="${config.accent===c?'active':''}" onclick="setAccent('${c}')"></button>`).join('');

  document.querySelectorAll('#style-switcher button').forEach(b => b.classList.toggle('active', b.dataset.style === config.style));
  document.querySelectorAll('#multi-switcher button').forEach(b => b.classList.toggle('active', (b.dataset.val === 'true') === config.multi));

  renderAdminItems();
  loadDashboard();
}

function setAccent(c){
  config.accent = c;
  document.documentElement.style.setProperty('--accent', c);
  showAdmin();
}

function renderAdminItems(){
  const list = document.getElementById('admin-item-list');
  list.innerHTML = config.items.map((it, i) => `
    <div class="row">
      <input class="row-input" value="${esc(it.text)}" oninput="config.items[${i}].text = this.value">
      <button class="row-del" onclick="config.items.splice(${i},1); renderAdminItems();">×</button>
    </div>
  `).join('');
}

document.getElementById('admin-add-btn').onclick = () => {
  config.items.push({ id: 'it_' + Date.now().toString(36), text: '' });
  renderAdminItems();
};

document.getElementById('style-switcher').onclick = (e) => {
  const btn = e.target.closest('button[data-style]');
  if(btn){ config.style = btn.dataset.style; showAdmin(); }
};
document.getElementById('multi-switcher').onclick = (e) => {
  const btn = e.target.closest('button[data-val]');
  if(btn){ config.multi = (btn.dataset.val === 'true'); showAdmin(); }
};

document.getElementById('admin-save-btn').onclick = async () => {
  config.title = document.getElementById('admin-title').value.trim() || '체크리스트';
  config.subtitle = document.getElementById('admin-subtitle').value.trim();
  const newPw = document.getElementById('admin-pw-change').value.trim();
  if(newPw) config.password = newPw;

  try {
    const { error } = await db.from('checklist_config').upsert({ id: 1, ...config, updated_at: new Date().toISOString() });
    if(error) alert('양식 저장 실패: ' + error.message);
    else {
      showNotice('배포 완료');
      loadConfig();
    }
  } catch(err){ alert('오류: ' + err.message); }
};

// 대시보드
async function loadDashboard(){
  try {
    const { data } = await db.from('submissions').select('*').order('updated_at', { ascending: false });
    allSubs = data || [];
    renderDashboard();
  } catch(e){}
}

function renderDashboard(){
  const q = (document.getElementById('dash-search').value || '').trim().toLowerCase();
  const sort = document.getElementById('dash-sort').value;
  const total = config.items.length;

  let list = allSubs.map(s => {
    const cCount = config.items.filter(it => s.checks && s.checks[it.id]).length;
    const pct = total ? Math.round(cCount / total * 100) : 0;
    return { ...s, cCount, pct };
  });

  if(q) list = list.filter(s => s.name.toLowerCase().includes(q));

  if(sort === 'pct-desc') list.sort((a,b) => b.pct - a.pct);
  else if(sort === 'pct-asc') list.sort((a,b) => a.pct - b.pct);
  else if(sort === 'name') list.sort((a,b) => a.name.localeCompare(b.name, 'ko'));

  document.getElementById('stat-count').textContent = allSubs.length;
  const avg = allSubs.length ? Math.round(list.reduce((acc,cur)=>acc+cur.pct, 0) / allSubs.length) : 0;
  document.getElementById('stat-avg').textContent = avg + '%';
  document.getElementById('stat-complete').textContent = allSubs.filter(s => s.pct === 100).length;

  const el = document.getElementById('dash-list');
  el.innerHTML = list.map(s => `
    <div class="sub-row">
      <div style="min-width:90px;">
        <div class="sub-name">${esc(s.name)}</div>
        <div class="sub-time">${s.cCount}/${total} 완료</div>
      </div>
      <div class="sub-bar-wrap"><div class="sub-bar-fill" style="width:${s.pct}%"></div></div>
      <div class="sub-pct">${s.pct}%</div>
      <button class="row-del" onclick="delSub('${s.id}')">×</button>
    </div>
  `).join('') || '<div style="text-align:center; color:var(--ink-faint); padding:20px;">제출 내역이 없습니다.</div>';
}

async function delSub(id){
  if(confirm('이 제출 내역을 삭제할까요? 되돌릴 수 없습니다.')){
    await db.from('submissions').delete().eq('id', id);
    loadDashboard();
  }
}

document.getElementById('dash-search').oninput = renderDashboard;
document.getElementById('dash-sort').onchange = renderDashboard;

document.getElementById('tab-btn-form').onclick = () => {
  document.getElementById('tab-btn-form').classList.add('active');
  document.getElementById('tab-btn-dash').classList.remove('active');
  document.getElementById('tab-form').classList.add('active');
  document.getElementById('tab-dash').classList.remove('active');
};
document.getElementById('tab-btn-dash').onclick = () => {
  document.getElementById('tab-btn-dash').classList.add('active');
  document.getElementById('tab-btn-form').classList.remove('active');
  document.getElementById('tab-dash').classList.add('active');
  document.getElementById('tab-form').classList.remove('active');
  loadDashboard();
};

document.getElementById('gate-start-btn').onclick = startSubmitting;
document.getElementById('gate-name-input').onkeydown = (e) => { if(e.key === 'Enter') startSubmitting(); };

document.getElementById('switch-person-btn').onclick = () => {
  localStorage.removeItem('subId');
  localStorage.removeItem('subName');
  subId = null; subName = null; mySub = null;
  document.getElementById('gate-name-input').value = '';
  showScreen('screen-gate');
};
document.getElementById('admin-logout-btn').onclick = () => {
  isAdmin = false;
  subId ? enterSubmitter() : showScreen('screen-gate');
};

// 최초 실행
(async () => {
  await loadConfig();
  if(subId && /^[0-9a-f-]{36}$/i.test(subId)) {
    enterSubmitter();
  } else {
    showScreen('screen-gate');
  }
})();
</script>
